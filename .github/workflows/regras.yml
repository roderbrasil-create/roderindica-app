name: Testes das regras do Firebase
on:
  push:
    paths: ['firestore.rules', 'storage.rules', 'testes-regras/**', '.github/workflows/regras.yml']
  workflow_dispatch:
jobs:
  regras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '21' }
      - name: Instala ferramentas
        working-directory: testes-regras
        run: |
          cp ../firestore.rules ../storage.rules .
          npm init -y >/dev/null
          npm i firebase-tools@14 @firebase/rules-unit-testing@4 firebase@11 --no-audit --no-fund
      - name: Roda os testes no emulador
        working-directory: testes-regras
        run: npx firebase emulators:exec --only firestore,storage --project demo-roder "node --test --test-reporter=spec regras.test.mjs" 2>&1 | tee saida.txt; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Resumo para leitura
        if: always()
        working-directory: testes-regras
        shell: bash
        run: |
          set +e
          touch saida.txt
          RES=$(grep -E "^ℹ (tests|pass|fail)" saida.txt | tr '\n' ' ')
          echo "::notice::RESUMO $RES"
          FALHAS=$(grep -E "✖" saida.txt | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          [ -n "$FALHAS" ] && echo "::error::FALHAS%0A$FALHAS"
          FIM=$(tail -60 saida.txt | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::warning::FINAL%0A$FIM"
          exit 0
